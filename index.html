<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prototitle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div id="menu-screen" class="screen">
            <h1>PROTOTITLE</h1>
            <div class="instructions"></div>
            <button id="start-btn" class="btn">START</button>
        </div>

    <div id="game-screen" class="screen hidden">
        <div class="hud">
            <div id="level-display">Level: 1</div>
            <div id="timer-display">Time: 60s</div>
            <div id="score-display">Score: 0</div>
        </div>
        <div class="card">
            <h2 id="question-text">Loading question...</h2>
            <div class="input-group">
                <input type="number" id="answer-input" placeholder="Enter Answer" autofocus />
                <button id="submit-btn" class="btn">SUBMIT</button>
            </div>
        </div>
    </div>

    <div id="jumpscare-overlay" class="overlay hidden">
        <div class="jumpscare-content">
            <h1 class="scary-text">TOO SLOW!</h1>
            <p id="final-score-text">Final Score: 0</p>
            <button id="restart-btn" class="btn">TRY AGAIN</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
